[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-app"
version = "0.0.0"
description = "Spectra desktop preview utilities"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "PySide6>=6.8.2,<6.11",
    "pyqtgraph==0.13.7",
    "astropy==7.1.1",
    "pandas==2.2.3",
    "requests>=2.32.3,<3",
    "astroquery==0.4.7",
]

[project.optional-dependencies]
remote = [
    "requests>=2.32.3,<3",
    "astroquery==0.4.7",
]
hdf = [
    "h5py>=3.10.0",
    "pyhdf>=0.11.6",
]
dev = [
    "pytest==9.0.3",
    "pylint>=3.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[tool.pytest.ini_options]
markers = [
    "roundtrip: Validate round-trip ingest/export workflows.",
    "ui_contract: UI contract tests that require a Qt display.",
]

[tool.black]
line-length = 120
target-version = ['py311']
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

